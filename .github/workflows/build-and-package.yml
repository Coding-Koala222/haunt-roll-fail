name: Build and Export Output

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SBT_OPTS: "-Xms1G -Xmx6G -Xss4M -XX:MaxMetaspaceSize=1G -XX:+UseG1GC"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Build scala-js-dom-reduced
        working-directory: scala-js-dom-reduced
        run: sbt "publishLocal"

      - name: Build haunt-roll-fail (Scala.js)
        working-directory: haunt-roll-fail
        run: sbt "fastOptJS"

      - name: Generate static output (create only)
        working-directory: good-game
        run: |
          OUT_BASE="$GITHUB_WORKSPACE/good-game-database"
          mkdir -p "$OUT_BASE"
          sbt "run create $OUT_BASE $GITHUB_WORKSPACE/haunt-roll-fail http://localhost:7070 http://localhost:7070/hrf/ 7070"

      - name: Collect output files for artifact
        run: |
          ARTIFACT_DIR="$GITHUB_WORKSPACE/good-game-database-artifact"
          mkdir -p "$ARTIFACT_DIR"

          # HSQLDB files created by `run create`
          cp "$GITHUB_WORKSPACE/good-game-database.script" "$ARTIFACT_DIR/" || true
          cp "$GITHUB_WORKSPACE/good-game-database.properties" "$ARTIFACT_DIR/" || true
          cp "$GITHUB_WORKSPACE/good-game-database.log" "$ARTIFACT_DIR/" || true

          # Optional temp folder (if present)
          if [ -d "$GITHUB_WORKSPACE/good-game-database.tmp" ]; then
            cp -R "$GITHUB_WORKSPACE/good-game-database.tmp" "$ARTIFACT_DIR/"
          fi

          echo "Collected artifact contents:"
          ls -la "$ARTIFACT_DIR"

      - name: Upload generated output
        uses: actions/upload-artifact@v4
        with:
          name: good-game-database
          path: ${{ github.workspace }}/good-game-database-artifact/**
          if-no-files-found: error
