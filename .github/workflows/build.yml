name: Build Runnable Artifact

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Build fat JAR with sbt-assembly
        run: sbt ";clean;assembly"

      - name: Upload runnable JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: haunt-roll-fail-jar
          path: target/scala-*/haunt-roll-fail.jar
          if-no-files-found: error
